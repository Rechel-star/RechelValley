<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>星曌谷物语</title>
  <style>
    :root {
      --ink: #2b1725;
      --paper: #fff0bd;
      --paper-dark: #e7bf77;
      --wood: #7a3f25;
      --wood-dark: #3e2030;
      --gold: #ffd35d;
      --leaf: #315f46;
      --scene-scale: 1;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      color: var(--paper);
      background:
        linear-gradient(rgba(18, 24, 24, .54), rgba(28, 14, 27, .82)),
        repeating-linear-gradient(90deg, #294b38 0 28px, #31543e 28px 56px);
      font-family: "Courier New", "Microsoft YaHei", monospace;
    }

    button { font: inherit; }

    .title-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 0;
      cursor: pointer;
      color: inherit;
      background: #261432 url("source/title-bg.png") center / cover no-repeat;
      transition: opacity 420ms var(--ease), visibility 420ms;
      -webkit-tap-highlight-color: transparent;
    }

    .title-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(transparent 68%, rgba(19, 8, 25, .55));
    }

    .title-sign {
      position: absolute;
      inset: 0;
      background: url("source/title-sign.png") center / contain no-repeat;
      image-rendering: pixelated;
      will-change: transform;
    }

    .title-sign-main {
      clip-path: inset(0 0 34% 0);
      transform: translateY(-110%);
    }

    .title-sign-start {
      clip-path: inset(68% 0 0 0);
      transform: translateY(110%);
    }

    .title-screen.is-assembling .title-sign-main {
      animation: sign-drop 3s cubic-bezier(.18, .76, .2, 1) both;
    }

    .title-screen.is-assembling .title-sign-start {
      animation: sign-rise 3s cubic-bezier(.18, .76, .2, 1) both;
    }

    .title-screen.is-assembling .enter-mark {
      animation: enter-ready 3.15s steps(1, end) both, enter-nudge 1s steps(2, end) 3.15s infinite;
    }

    .enter-mark {
      position: absolute;
      z-index: 2;
      bottom: max(7%, env(safe-area-inset-bottom));
      left: 50%;
      width: 18px;
      height: 18px;
      border-right: 4px solid var(--paper);
      border-bottom: 4px solid var(--paper);
      filter: drop-shadow(3px 3px 0 var(--wood-dark));
      transform: translateX(-50%) rotate(45deg);
      animation: enter-nudge 1s steps(2, end) infinite;
    }

    .title-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .game {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      opacity: 0;
      transform: scale(.985);
      transition: opacity 500ms ease 180ms, transform 650ms var(--ease) 180ms;
    }

    .game.is-ready {
      opacity: 1;
      transform: scale(1);
    }

    .mobile-controls {
      position: fixed;
      inset: auto 0 0;
      z-index: 85;
      display: none;
      align-items: flex-end;
      justify-content: space-between;
      padding:
        0 max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .virtual-joystick,
    .mobile-action {
      position: relative;
      margin: 0;
      padding: 0;
      border: 5px solid #3e2030;
      border-radius: 50%;
      color: #fff0bd;
      background: rgba(184, 113, 57, .86);
      box-shadow:
        inset 0 0 0 4px rgba(255, 211, 93, .35),
        5px 6px 0 rgba(30, 15, 25, .42);
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .virtual-joystick {
      width: 112px;
      height: 112px;
      background:
        linear-gradient(90deg, transparent 47%, rgba(62, 32, 48, .28) 47% 53%, transparent 53%),
        linear-gradient(transparent 47%, rgba(62, 32, 48, .28) 47% 53%, transparent 53%),
        rgba(184, 113, 57, .86);
    }

    .joystick-thumb {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 46px;
      height: 46px;
      border: 4px solid #3e2030;
      border-radius: 50%;
      background: #ffd35d;
      box-shadow: inset 0 0 0 4px #e89b3c;
      transform: translate(-50%, -50%);
      pointer-events: none;
      will-change: transform;
    }

    .virtual-joystick.is-active {
      background-color: rgba(145, 78, 40, .92);
    }

    .mobile-action {
      display: grid;
      width: 74px;
      height: 74px;
      place-items: center;
      background: rgba(181, 67, 58, .9);
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 2px 2px 0 #7a3f25;
      touch-action: manipulation;
    }

    .mobile-action:active,
    .mobile-action.is-active {
      box-shadow:
        inset 0 0 0 4px rgba(255, 211, 93, .28),
        2px 3px 0 rgba(30, 15, 25, .42);
      transform: translate(3px, 3px);
    }

    .virtual-joystick:focus-visible,
    .mobile-action:focus-visible {
      outline: 3px solid #fff0bd;
      outline-offset: 3px;
    }

    .scene-shell {
      position: relative;
      overflow: hidden;
      background: #cfbd92;
      filter: drop-shadow(0 18px 30px rgba(15, 8, 18, .48));
    }

    .scene {
      position: absolute;
      left: 0;
      top: 0;
      width: 960px;
      height: 640px;
      overflow: hidden;
      transform: scale(var(--scene-scale));
      transform-origin: 0 0;
      background: #cfbd92 url("scene-data/living-room.png") center / 960px 640px no-repeat;
      image-rendering: pixelated;
      cursor: default;
    }

    .scene:focus { outline: none; }

    .scene.has-data { background-image: none; }

    .scene.is-switching {
      animation: scene-change 360ms steps(6, end);
    }

    .scene-object {
      position: absolute;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      transform-origin: center;
      pointer-events: none;
    }

    .scene-object.interactive {
      cursor: default;
      pointer-events: auto;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .scene-object.interactive.is-near {
      cursor: pointer;
    }

    .object-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: pixelated;
      user-select: none;
      -webkit-user-drag: none;
    }

    .scene-object.is-interacting .object-img {
      animation: object-nudge 420ms steps(4, end);
    }

    .scene-object.sunflower.is-interacting .object-img,
    .scene-object.redFlowers.is-interacting .object-img,
    .scene-object.carrot.is-interacting .object-img {
      animation-name: flower-sway;
      transform-origin: 50% 100%;
    }

    .scene-object.computer.is-interacting .object-img {
      animation-name: computer-pulse;
    }

    .piano-lid,
    .key-glow,
    .music-note {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
    }

    .piano-lid {
      left: 12%;
      top: 9%;
      width: 76%;
      height: 28%;
      border: 3px solid #3c1d16;
      background: #70411f;
      box-shadow: inset 0 3px 0 #a76a31;
      transform: translateY(7px) scaleY(.12);
      transform-origin: 50% 100%;
    }

    .key-glow {
      left: 13%;
      top: 55%;
      width: 74%;
      height: 14%;
      background: rgba(255, 246, 190, .72);
      box-shadow: 0 0 8px var(--gold);
      mix-blend-mode: screen;
    }

    .music-note {
      top: 18%;
      color: var(--gold);
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      text-shadow: 2px 2px 0 var(--wood-dark);
    }

    .music-note.one { left: 29%; }
    .music-note.two { left: 64%; font-size: 17px; }

    .piano.is-playing .object-img {
      animation: piano-bounce 520ms steps(6, end);
    }

    .piano.is-playing .piano-lid {
      animation: lid-open 520ms steps(6, end);
    }

    .piano.is-playing .key-glow {
      animation: keys-flash 420ms steps(4, end);
    }

    .piano.is-playing .music-note {
      animation: note-rise 700ms steps(7, end);
    }

    .piano.is-playing .music-note.two { animation-delay: 90ms; }

    .bookcase.is-reading .object-img {
      animation: bookcase-bump 360ms steps(4, end);
    }

    .dog .object-img {
      animation: dog-idle 1.4s steps(4, end) infinite;
      transform-origin: 50% 100%;
    }

    .dog.is-loved .object-img {
      animation: dog-happy 680ms steps(6, end);
    }

    .cat .object-img {
      animation: cat-idle 1.8s steps(4, end) infinite;
      transform-origin: 50% 100%;
    }

    .cat.is-loved .object-img {
      animation: cat-happy 720ms steps(6, end);
    }

    .scene-heart {
      visibility: hidden;
    }

    .scene-heart.is-visible {
      visibility: visible;
    }

    .scene-heart.is-visible .object-img {
      animation: heart-pop 900ms steps(8, end) both;
    }

    .scene-heart.cat-heart.is-visible .object-img {
      animation-duration: 1.5s;
    }

    .player-character {
      position: absolute;
      z-index: 900;
      width: 28px;
      height: 44px;
      padding: 0;
      cursor: pointer;
      border: 0;
      background: transparent;
      pointer-events: auto;
      will-change: left, top;
      filter: drop-shadow(2px 3px 0 rgba(45, 27, 31, .4));
    }

    .player-shadow {
      position: absolute;
      left: 50%;
      bottom: -1px;
      width: 22px;
      height: 5px;
      background: rgba(42, 24, 30, .38);
      transform: translateX(-50%);
    }

    .player-avatar {
      position: absolute;
      inset: 0;
      transform-origin: 50% 100%;
    }

    .player-hair-back,
    .player-face,
    .player-hair-front,
    .player-body,
    .player-skirt,
    .player-arm,
    .player-foot {
      position: absolute;
      display: block;
    }

    .player-hair-back {
      z-index: 1;
      left: 3px;
      top: 5px;
      width: 22px;
      height: 22px;
      border: 2px solid #422436;
      background: #df78a7;
      box-shadow:
        inset 2px 0 0 #f6a9c7,
        inset -2px 0 0 #b94c7d,
        -2px 8px 0 #422436,
        2px 8px 0 #422436,
        -2px 10px 0 #c75c8c,
        2px 10px 0 #b94c7d;
    }

    .player-face {
      z-index: 2;
      left: 7px;
      top: 11px;
      width: 14px;
      height: 12px;
      background: #efad8b;
      border: 2px solid #422436;
      box-shadow: inset 0 -2px 0 #d98974;
    }

    .player-face::before {
      content: "";
      position: absolute;
      left: 0;
      top: 3px;
      width: 4px;
      height: 4px;
      background: #fff8ef;
      box-shadow: 6px 0 0 #fff8ef;
    }

    .player-face::after {
      content: "";
      position: absolute;
      z-index: 1;
      left: 1px;
      top: 4px;
      width: 2px;
      height: 2px;
      background: #322037;
      box-shadow: 6px 0 0 #322037;
    }

    .player-hair-front {
      z-index: 3;
      left: 5px;
      top: 3px;
      width: 18px;
      height: 8px;
      border: 2px solid #422436;
      background: #ed8ab4;
      box-shadow:
        -2px 2px 0 #422436,
        2px 2px 0 #422436,
        inset 4px 2px 0 #ffc1d7,
        inset -3px 0 0 #bf527f;
    }

    .player-hair-front::before {
      content: "";
      position: absolute;
      left: 1px;
      top: 6px;
      width: 6px;
      height: 5px;
      background: #f09abc;
      box-shadow:
        -2px 0 0 #422436,
        10px 0 0 #bd4d7d,
        12px 0 0 #422436;
    }

    .player-hair-front::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 1px;
      width: 5px;
      height: 2px;
      background: #ffd2e1;
    }

    .player-body {
      z-index: 2;
      left: 7px;
      top: 24px;
      width: 14px;
      height: 9px;
      border: 2px solid #342334;
      background: #201b27;
      box-shadow: inset 2px 0 0 #44374d, inset -2px 0 0 #100e15;
    }

    .player-body::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 0;
      width: 3px;
      height: 2px;
      background: #efad8b;
    }

    .player-body::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 2px;
      background: #bd5f87;
    }

    .player-skirt {
      z-index: 2;
      left: 5px;
      top: 31px;
      width: 18px;
      height: 10px;
      border: 2px solid #342334;
      background: #18151e;
      box-shadow:
        -2px 5px 0 #342334,
        2px 5px 0 #342334,
        -2px 7px 0 #18151e,
        2px 7px 0 #18151e,
        inset 3px 0 0 #3d3245,
        inset -2px 0 0 #0d0c11;
    }

    .player-arm {
      z-index: 1;
      top: 25px;
      width: 4px;
      height: 11px;
      border: 1px solid #422436;
      background: linear-gradient(#24202b 0 45%, #e5a082 45% 100%);
      transform-origin: 50% 0;
    }

    .player-arm.left { left: 2px; }
    .player-arm.right { right: 2px; }

    .player-foot {
      z-index: 1;
      bottom: 0;
      width: 6px;
      height: 3px;
      background: #35283a;
      box-shadow: 0 1px 0 #17131b;
    }

    .player-foot.left { left: 5px; }
    .player-foot.right { right: 5px; }

    .player-character[data-direction="left"] .player-avatar {
      transform: scaleX(-1);
    }

    .player-character[data-direction="up"] .player-face::before {
      display: none;
    }

    .player-character[data-direction="up"] .player-face::after {
      display: none;
    }

    .player-character[data-direction="up"] .player-hair-front {
      left: 5px;
      width: 18px;
      height: 16px;
      background: #d96f9f;
      box-shadow:
        -2px 2px 0 #422436,
        2px 2px 0 #422436,
        inset 3px 2px 0 #f3a3c1,
        inset -3px 0 0 #ad4774;
    }

    .player-character[data-direction="up"] .player-hair-front::before {
      display: none;
    }

    .player-character.is-walking .player-avatar {
      animation: player-bob 320ms steps(2, end) infinite;
    }

    .player-character.is-walking .player-arm.left,
    .player-character.is-walking .player-foot.right {
      animation: limb-forward 320ms steps(2, end) infinite;
    }

    .player-character.is-walking .player-arm.right,
    .player-character.is-walking .player-foot.left {
      animation: limb-back 320ms steps(2, end) infinite;
    }

    .player-character {
      width: 30px;
      height: 46px;
    }

    .player-sprite {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      visibility: hidden;
      object-fit: contain;
      object-position: center bottom;
      image-rendering: pixelated;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: 50% 100%;
    }

    .player-character[data-direction="down"] .player-front,
    .player-character[data-direction="up"] .player-back,
    .player-character[data-direction="right"] .player-side,
    .player-character[data-direction="left"] .player-side {
      visibility: visible;
    }

    .player-character[data-direction="left"] .player-avatar {
      transform: none;
    }

    .player-character[data-direction="left"] .player-side {
      transform: scaleX(-1);
    }

    .player-character.is-walking .player-avatar {
      animation: player-bob 300ms steps(2, end) infinite;
    }

    .player-character.is-walking[data-direction="left"] .player-side {
      animation: sprite-step-left 300ms steps(2, end) infinite;
    }

    .player-character.is-walking[data-direction="right"] .player-side {
      animation: sprite-step-right 300ms steps(2, end) infinite;
    }

    .player-character.is-walking[data-direction="up"] .player-back,
    .player-character.is-walking[data-direction="down"] .player-front {
      animation: sprite-step-front 300ms steps(2, end) infinite;
    }

    .player-step {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 0;
      width: 4px;
      height: 2px;
      opacity: 0;
      background: rgba(255, 242, 206, .4);
      transform: translateX(-50%);
    }

    .player-character.is-walking .player-step {
      animation: step-dust 600ms steps(3, end) infinite;
    }

    @keyframes sprite-step-left {
      0%, 100% { transform: scaleX(-1) translateX(-1px) rotate(-1deg); }
      50% { transform: scaleX(-1) translateX(1px) rotate(1deg); }
    }

    @keyframes sprite-step-right {
      0%, 100% { transform: translateX(-1px) rotate(-1deg); }
      50% { transform: translateX(1px) rotate(1deg); }
    }

    @keyframes sprite-step-front {
      0%, 100% { transform: translateX(-1px); }
      50% { transform: translateX(1px); }
    }

    @keyframes step-dust {
      0% { width: 4px; opacity: 0; }
      35% { opacity: .65; }
      100% { width: 16px; opacity: 0; }
    }

    .character-dialogue {
      position: fixed;
      z-index: 75;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      width: min(760px, calc(100% - 24px));
      min-height: 210px;
      overflow: hidden;
      color: #4b271c;
      background: #e69a3d;
      border: 7px solid #76330f;
      box-shadow:
        0 0 0 3px #d47a21,
        0 0 0 6px #3e2016,
        inset 0 0 0 3px #ffca67,
        8px 10px 0 rgba(32, 17, 25, .5);
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 24px);
      transition: opacity 160ms steps(3, end), transform 220ms var(--ease), visibility 160ms;
    }

    .character-dialogue.is-open {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .dialogue-copy {
      position: relative;
      min-width: 0;
      padding: 24px 52px 28px 24px;
      background:
        repeating-linear-gradient(0deg, transparent 0 31px, rgba(160, 85, 31, .08) 31px 32px),
        linear-gradient(#ffd78a, #f7b75f);
      border-right: 7px solid #76330f;
      box-shadow: inset 0 0 0 3px rgba(255, 236, 171, .65);
    }

    .dialogue-copy p {
      margin: 0;
      color: #4e291e;
      font-family: "Microsoft YaHei", "Courier New", monospace;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.8;
      letter-spacing: 0;
      white-space: pre-line;
      text-shadow: 1px 1px 0 rgba(255, 231, 170, .75);
    }

    .dialogue-portrait {
      position: relative;
      display: grid;
      place-items: center;
      padding: 12px 16px 42px;
      background:
        repeating-linear-gradient(90deg, rgba(92, 42, 18, .12) 0 3px, transparent 3px 22px),
        #bd6a2d;
      box-shadow: inset 0 0 0 3px #efaa53;
    }

    .dialogue-portrait img {
      width: 128px;
      height: 128px;
      object-fit: contain;
      image-rendering: pixelated;
      background: #c8a77d;
      border: 5px solid #6f2f12;
      box-shadow: 0 0 0 3px #f1b252;
    }

    .dialogue-name {
      position: absolute;
      right: 14px;
      bottom: 10px;
      left: 14px;
      display: grid;
      place-items: center;
      height: 30px;
      color: #4b2518;
      background: #f9cd76;
      border: 3px solid #7c3817;
      font-size: 17px;
      font-weight: 900;
    }

    .dialogue-close {
      position: absolute;
      right: 13px;
      bottom: 13px;
      width: 25px;
      height: 25px;
      padding: 0;
      cursor: pointer;
      color: #4d2115;
      background: #c6782e;
      border: 3px solid #6e3014;
      box-shadow: inset 0 0 0 2px #eaa14d;
    }

    .dialogue-close::before,
    .dialogue-close::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 9px;
      width: 10px;
      height: 3px;
      background: currentColor;
    }

    .dialogue-close::before { transform: rotate(45deg); }
    .dialogue-close::after { transform: rotate(-45deg); }
    .dialogue-close:focus-visible { outline: 3px solid #fff1b0; outline-offset: 2px; }

    .computer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      background: rgba(24, 13, 25, .72);
      transition: opacity 160ms ease, visibility 160ms;
    }

    .computer-backdrop.is-open {
      opacity: 1;
      visibility: visible;
    }

    .computer-window {
      width: min(680px, 100%);
      color: #512819;
      transform: translateY(18px) scale(.97);
      transition: transform 180ms steps(3, end);
    }

    .computer-backdrop.is-open .computer-window {
      transform: translateY(0) scale(1);
    }

    .computer-titlebar {
      width: fit-content;
      min-width: 250px;
      margin: 0 0 14px 18px;
      padding: 12px 24px;
      color: #63311e;
      background: linear-gradient(#ffd28a, #efa354);
      border: 7px solid #783511;
      box-shadow:
        0 0 0 3px #d7761e,
        5px 6px 0 rgba(38, 19, 26, .5),
        inset 0 0 0 3px #ffe0a2;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .computer-panel {
      position: relative;
      min-height: 390px;

    .scroll-sheet {
      position: relative;
      width: min(560px, calc(100% - 30px));
      min-height: 330px;
      padding: 56px 58px 62px;
      color: #54301e;
      background:
        repeating-linear-gradient(0deg, transparent 0 27px, rgba(128, 73, 34, .08) 27px 28px),
        linear-gradient(90deg, #d89543, #ffd990 8%, #f8c874 50%, #ffd990 92%, #d89543);
      border: 5px solid #73320f;

        0 0 0 3px #c66c1c,
        9px 11px 0 rgba(38, 19, 26, .52),
        inset 0 0 18px rgba(104, 48, 18, .22);

    .scroll-sheet::after {
      content: "";

      right: 20px;
      width: 30px;
      height: 30px;
    }

    @keyframes scroll-page-turn {
      0% { opacity: 1; transform: translateX(0) scaleX(1); }
      45% { opacity: 0; transform: translateX(-10px) scaleX(.92); }
      55% { opacity: 0; transform: translateX(10px) scaleX(.92); }

      100% { opacity: 0; transform: translate(-50%, calc(-100% - 30px)); }
    }

    @keyframes butterfly-caught {

    .achievement-board-backdrop {

      background: #9d481e;

    .achievement-list {

    .achievement-entry {

    .catalog-star {

      clip-path: polygon(50% 0, 61% 34%, 98% 35%, 68% 56%, 79% 93%, 50% 71%, 21% 93%, 32% 56%, 2% 35%, 39% 34%);
      filter: drop-shadow(3px 3px 0 rgba(91, 47, 24, .32));

    .achievement-entry h2 {
      margin: 0 0 7px;
      font-size: 19px;

      font-size: 14px;
      font-weight: 900;
      line-height: 1.45;
    }

    .achievement-entry.is-locked h2,

    .manual-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      background: rgba(24, 12, 27, .68);
      transition: opacity 180ms ease, visibility 180ms;
    }

    .manual-backdrop.is-open {
      opacity: 1;
      visibility: visible;
    }

    .manual {
      position: relative;
      width: min(520px, 100%);
      min-height: 260px;
      max-height: min(78vh, 680px);
      overflow-y: auto;
      padding: 34px 34px 30px;
      color: var(--ink);
      background:
        repeating-linear-gradient(0deg, transparent 0 23px, rgba(116, 67, 40, .08) 23px 24px),
        var(--paper);
      border: 5px solid var(--wood);
      border-radius: 6px;
      box-shadow:
        inset 0 0 0 4px var(--paper-dark),
        10px 10px 0 rgba(35, 17, 34, .72);
      transform: translateY(16px) scale(.96);
      transition: transform 240ms var(--ease);
    }

    .manual-backdrop.is-open .manual { transform: translateY(0) scale(1); }

    .manual::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 2px dashed rgba(122, 63, 37, .35);
      pointer-events: none;
    }

    .manual h1 {
      position: relative;
      margin: 0 44px 22px 0;
      color: var(--wood-dark);
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .manual p {
      position: relative;
      margin: 0;
      color: #65432f;
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .manual-close {
      position: absolute;
      z-index: 2;
      top: 20px;
      right: 20px;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      padding: 0;
      cursor: pointer;
      color: var(--paper);
      background: #b6403d;
      border: 3px solid var(--wood-dark);
      box-shadow: 3px 3px 0 rgba(62, 32, 48, .35);

    .manual-close:hover { background: #d65348; }

    .manual-close::before,
    .manual-close::after {
      content: "";
      position: absolute;

      height: 3px;
      background: currentColor;

    .manual-close::before { transform: rotate(45deg); }
    .manual-close::after { transform: rotate(-45deg); }

      border: 3px solid var(--wood);
      box-shadow: 4px 4px 0 var(--wood-dark);
      font-size: 12px;
    }

    .load-error.is-visible { display: block; }

    @keyframes sign-drop {

      72% { transform: translateY(2.2%); }
      86% { transform: translateY(-1%); }
      100% { transform: translateY(0); }
    }

    @keyframes sign-rise {
      0% { transform: translateY(110%); }
      72% { transform: translateY(-2.2%); }
      86% { transform: translateY(1%); }
      100% { transform: translateY(0); }
    }

    @keyframes enter-ready {
      0%, 94% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes enter-nudge {
      0%, 100% { transform: translate(-50%, -5px) rotate(45deg); }
      50% { transform: translate(-50%, 5px) rotate(45deg); }
    }

    @keyframes object-nudge {
      0%, 100% { transform: translateY(0); filter: brightness(1); }
      35% { transform: translateY(-3px); filter: brightness(1.18); }
      70% { transform: translateY(1px); filter: brightness(1.05); }
    }

    @keyframes flower-sway {
      0%, 100% { transform: rotate(0); }
      30% { transform: rotate(-6deg); }
      65% { transform: rotate(5deg); }
    }

    @keyframes computer-pulse {
      0%, 100% { filter: brightness(1); }
      35%, 70% { filter: brightness(1.55) drop-shadow(0 0 3px #8df3ff); }
    }

    @keyframes piano-bounce {

    @keyframes lid-open {
      0% { opacity: 0; transform: translateY(7px) scaleY(.12); }

      100% { opacity: 0; transform: translateY(7px) scaleY(.12); }

    @keyframes keys-flash {
      0%, 100% { opacity: 0; }
      28%, 62% { opacity: 1; }
    }

    @keyframes note-rise {
      0% { opacity: 0; transform: translateY(8px); }
      18% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-34px); }
    }

    @keyframes bookcase-bump {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      50% { transform: translateX(2px); }
      75% { transform: translateX(-1px); }

    @keyframes dog-idle {

      50% { transform: translateY(-1px); }
    }

    @keyframes dog-happy {

      22% { transform: translateY(-5px) rotate(4deg); }
      44% { transform: translateY(0) rotate(-4deg); }
      66% { transform: translateY(-3px) rotate(3deg); }
      84% { transform: translateY(0) rotate(-2deg); }

    @keyframes heart-pop {
      0% { opacity: 0; transform: translateY(8px) scale(.5); }

    @media (hover: none) and (pointer: coarse), (max-width: 900px) {
      .mobile-controls { display: flex; }
      .game.is-ready ~ .mobile-controls { opacity: 1; }

      .game.is-ready ~ .mobile-controls .mobile-action {
        pointer-events: auto;
      }
      body:has(.character-dialogue.is-open) .virtual-joystick {
        opacity: .35;
        pointer-events: none !important;
      }
      body:has(.manual-backdrop.is-open) .mobile-controls,
      body:has(.computer-backdrop.is-open) .mobile-controls,
      body:has(.scroll-backdrop.is-open) .mobile-controls,
      body:has(.achievement-board-backdrop.is-open) .mobile-controls {
        opacity: 0;
        pointer-events: none;
      }

    @media (max-height: 500px) and (orientation: landscape) {
      .mobile-controls {
        padding-bottom: max(10px, env(safe-area-inset-bottom));

      function fitScene() {
        const padding = window.innerWidth <= 560 ? 16 : 32;
        const availableWidth = Math.max(1, window.innerWidth - padding);
        const availableHeight = Math.max(1, window.innerHeight - padding);
        const viewport = SCENE_VIEWPORTS[currentScene];
        const scale = Math.min(
          availableWidth / viewport.width,
          availableHeight / viewport.height
        );
        document.documentElement.style.setProperty("--scene-scale", String(scale));
        scene.parentElement.style.width = `${viewport.width * scale}px`;
        scene.parentElement.style.height = `${viewport.height * scale}px`;
        scene.style.left = `${-viewport.x * scale}px`;
        scene.style.top = `${-viewport.y * scale}px`;
        scene.style.transform = `scale(${scale})`;
      }

      function objectTransform(item) {
        const flipX = Number(item.flipX) || 1;
        const flipY = Number(item.flipY) || 1;
        const rotation = Number(item.rotation) || 0;
        return `rotate(${rotation}deg) scale(${flipX}, ${flipY})`;
      }

      function makeDecoration(className) {
        const element = document.createElement("span");
        element.className = className;
        element.setAttribute("aria-hidden", "true");
        return element;
      }

      function makeSceneObject(item, sceneKey) {
        const isLiving = sceneKey === "living";
        const isFarm = sceneKey === "farm";
        const isBedroom = sceneKey === "bedroom";
        const interaction = INTERACTION_CONFIG[sceneKey]?.[item.id];
        const element = document.createElement(interaction ? "button" : "div");
        element.className = "scene-object";
        element.style.left = `${item.x}px`;
        element.style.top = `${item.y}px`;
        element.style.width = `${item.width}px`;
        element.style.height = `${item.height}px`;
        element.style.zIndex = String(item.z ?? 0);
        element.style.opacity = String(item.opacity ?? 1);
        element.style.transform = objectTransform(item);
        element.dataset.objectId = String(item.id);

        const image = document.createElement("img");
        image.className = "object-img";
        image.src = /^(data:|https?:)/.test(item.src) ? item.src : `${ASSET_PREFIX}${item.src}`;
        image.alt = "";
        image.draggable = false;
        element.append(image);

        if (interaction) {
          element.type = "button";
          element.classList.add("interactive", interaction.key);
          element.setAttribute("aria-label", interaction.label);
          element.dataset.interaction = interaction.key;
          element.dataset.interactionDistance = String(interaction.distance ?? INTERACTION_DISTANCE);
          element.addEventListener("click", () => attemptInteraction(element, activateInteraction));
        }

        if (interaction?.key === "piano") {
          element.append(
            makeDecoration("piano-lid"),
            makeDecoration("key-glow"),
            makeDecoration("music-note one")
          );
          const secondNote = makeDecoration("music-note two");
          element.querySelector(".music-note.one").textContent = "♪";
          secondNote.textContent = "♫";
          element.append(secondNote);
        }

        if (
          (isFarm && item.id === FARM_HEART_ID) ||
          (isBedroom && item.id === BEDROOM_HEART_ID)
        ) {
          element.classList.add("scene-heart");
          if (isBedroom) element.classList.add("cat-heart");
          element.style.opacity = "0";
        }

        return element;
      }

      function makePlayer(sceneKey, fromScene) {
        const spawn =
          SCENE_NAV[sceneKey].spawns[fromScene] ||
          SCENE_NAV[sceneKey].spawns.initial ||
          Object.values(SCENE_NAV[sceneKey].spawns)[0];
        const element = document.createElement("button");
        element.type = "button";
        element.className = "player-character";
        element.dataset.direction = "down";
        element.setAttribute("aria-label", "与瑞秋对话");
        element.innerHTML = `
          <span class="player-shadow"></span>
          <span class="player-avatar">
            <img class="player-sprite player-front" src="source/player/front.png" alt="">
            <img class="player-sprite player-side" src="source/player/side.png" alt="">
            <img class="player-sprite player-back" src="source/player/back.png" alt="">
          </span>
          <span class="player-step"></span>
        `;
        element.addEventListener("click", event => {
          event.stopPropagation();
          showRachelDialogue();
        });
        playerX = spawn.x;
        playerY = spawn.y;
        player = element;
        renderPlayer();
        return element;
      }

      async function loadScene(sceneKey = "living", animate = false, fromScene = "initial") {
        const config = SCENES[sceneKey];
        if (!config) return;

        try {
          let data = window.__SCENE_DATA__?.[sceneKey];
          if (!data) {
            const response = await fetch(config.data, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            data = await response.json();
          }
          const objects = [...data.objects].sort((a, b) => (a.z ?? 0) - (b.z ?? 0));
          currentScene = sceneKey;
          fitScene();
          game.setAttribute("aria-label", config.label);
          scene.style.backgroundColor = data.canvas?.color || "#cfbd92";
          scene.style.backgroundImage = "none";
          scene.replaceChildren(
            ...objects.map(item => makeSceneObject(item, sceneKey)),
            makePlayer(sceneKey, fromScene)
          );
          updateInteractionProximity();
          scene.classList.add("has-data");
          loadError.classList.remove("is-visible");
          transitionReadyAt = performance.now() + 500;

          if (animate) {
            scene.classList.remove("is-switching");
            void scene.offsetWidth;
            scene.classList.add("is-switching");
          }
        } catch (error) {
          console.error(`Unable to load ${sceneKey} scene data:`, error);
          scene.style.backgroundImage = `url("${config.fallback}")`;
          scene.classList.remove("has-data");
          loadError.classList.add("is-visible");
        } finally {
          sceneBusy = false;
        }
      }

      function resetVirtualJoystick() {
        const pointerId = virtualJoystickPointerId;
        virtualJoystickPointerId = null;
        virtualMovementKeys.clear();
        virtualJoystick.classList.remove("is-active");
        joystickThumb.style.transform = "translate(-50%, -50%)";
        if (pointerId !== null && virtualJoystick.hasPointerCapture?.(pointerId)) {
          virtualJoystick.releasePointerCapture(pointerId);
        }
      }

      function clearMovementInput() {
        movementKeys.clear();
        resetVirtualJoystick();
      }

      function switchScene(sceneKey) {
        if (sceneBusy || sceneKey === currentScene) return;
        const fromScene = currentScene;
        sceneBusy = true;
        lastFocusedObject = null;
        clearMovementInput();
        loadScene(sceneKey, true, fromScene);
      }

      function renderPlayer() {
        if (!player) return;
        player.style.left = `${Math.round(playerX)}px`;
        player.style.top = `${Math.round(playerY)}px`;
        updateInteractionProximity();
      }

      function distanceToObject(element) {
        const footX = playerX + PLAYER_WIDTH / 2;
        const footY = playerY + PLAYER_HEIGHT;
        const nearestX = Math.max(element.offsetLeft, Math.min(footX, element.offsetLeft + element.offsetWidth));
        const nearestY = Math.max(element.offsetTop, Math.min(footY, element.offsetTop + element.offsetHeight));
        return Math.hypot(footX - nearestX, footY - nearestY);
      }

      function updateInteractionProximity() {
        if (!player) return;
        scene.querySelectorAll(".scene-object.interactive").forEach(element => {
          const interactionDistance = Number(element.dataset.interactionDistance) || INTERACTION_DISTANCE;
          element.classList.toggle("is-near", distanceToObject(element) <= interactionDistance);
        });
      }

      function attemptInteraction(element, action) {
        if (!element.classList.contains("is-near") || sceneBusy) return;
        clearMovementInput();
        player?.classList.remove("is-walking");
        action(element);
        const achievement = INTERACTION_ACHIEVEMENTS[element.dataset.interaction];
        if (achievement) {
          const prefix = achievement.hidden ? "隐藏成就" : "新成就";
          unlockAchievement(achievement.key, `${prefix}：${achievement.title}`);
        }
      }

      function activateInteraction(element) {
        const actions = {
          piano: playPiano,
          bookcase: readBookcase,
          dog: petDog,
          cat: petCat,
          computer: openComputer,
          scroll: openScroll,
          butterfly: catchButterfly,
          statue: openAchievementBoard
        };
        const action = actions[element.dataset.interaction];
        if (action) {
          action(element);
        } else {
          inspectObject(element, element.dataset.interaction);
        }
      }

      function interactWithNearestObject() {
        const nearby = [...scene.querySelectorAll(".scene-object.interactive.is-near")]
          .sort((a, b) => distanceToObject(a) - distanceToObject(b))[0];
        if (!nearby) return;

        attemptInteraction(nearby, activateInteraction);
      }

      function setDirection(dx, dy) {
        if (!player || (!dx && !dy)) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          player.dataset.direction = dx < 0 ? "left" : "right";
        } else {
          player.dataset.direction = dy < 0 ? "up" : "down";
        }
      }

      function clampPlayer() {
        const bounds = SCENE_NAV[currentScene].bounds;
        playerX = Math.min(bounds.maxX, Math.max(bounds.minX, playerX));
        playerY = Math.min(bounds.maxY, Math.max(bounds.minY, playerY));
      }

      function playerHitbox(x, y) {
        return {
          x: x + 7,
          y: y + 34,
          width: 16,
          height: 12
        };
      }

      function rectanglesOverlap(a, b) {
        return (
          a.x < b.x + b.width &&
          a.x + a.width > b.x &&
          a.y < b.y + b.height &&
          a.y + a.height > b.y
        );
      }

      function canOccupy(x, y) {
        const hitbox = playerHitbox(x, y);
        return !SCENE_COLLIDERS[currentScene].some(obstacle =>
          rectanglesOverlap(hitbox, obstacle)
        );
      }

      function checkSceneExit(now) {
        if (now < transitionReadyAt || sceneBusy || !player) return;
        const footX = playerX + PLAYER_WIDTH / 2;
        const footY = playerY + PLAYER_HEIGHT;
        const exit = SCENE_NAV[currentScene].exits.find(zone =>
          footX >= zone.x &&
          footX <= zone.x + zone.width &&
          footY >= zone.y &&
          footY <= zone.y + zone.height
        );
        if (exit) switchScene(exit.target);
      }

      function movePlayer(now) {
        const elapsed = lastFrameTime ? Math.min((now - lastFrameTime) / 1000, .05) : 0;
        lastFrameTime = now;

        if (
          !player ||
          sceneBusy ||
          manualBackdrop.classList.contains("is-open") ||
          characterDialogue.classList.contains("is-open") ||
          computerBackdrop.classList.contains("is-open") ||
          scrollBackdrop.classList.contains("is-open") ||
          achievementBoardBackdrop.classList.contains("is-open")
        ) {
          requestAnimationFrame(movePlayer);
          return;
        }

        let dx = 0;
        let dy = 0;
        if (movementKeys.has("arrowleft") || movementKeys.has("a") || virtualMovementKeys.has("arrowleft")) dx -= 1;
        if (movementKeys.has("arrowright") || movementKeys.has("d") || virtualMovementKeys.has("arrowright")) dx += 1;
        if (movementKeys.has("arrowup") || movementKeys.has("w") || virtualMovementKeys.has("arrowup")) dy -= 1;
        if (movementKeys.has("arrowdown") || movementKeys.has("s") || virtualMovementKeys.has("arrowdown")) dy += 1;

        const moving = Boolean(dx || dy);
        player.classList.toggle("is-walking", moving);

        if (moving) {
          const length = Math.hypot(dx, dy) || 1;
          dx /= length;
          dy /= length;
          setDirection(dx, dy);
          const bounds = SCENE_NAV[currentScene].bounds;
          const stepX = dx * PLAYER_SPEED * elapsed;
          const stepY = dy * PLAYER_SPEED * elapsed;
          const nextX = Math.min(bounds.maxX, Math.max(bounds.minX, playerX + stepX));
          const nextY = Math.min(bounds.maxY, Math.max(bounds.minY, playerY + stepY));
          let moved = false;

          if (canOccupy(nextX, playerY)) {
            playerX = nextX;
            moved = moved || Math.abs(stepX) > .01;
          }
          if (canOccupy(playerX, nextY)) {
            playerY = nextY;
            moved = moved || Math.abs(stepY) > .01;
          }

          if (!moved) {
            player.classList.remove("is-walking");
          }

          renderPlayer();
          checkSceneExit(now);
        }

        requestAnimationFrame(movePlayer);
      }

      function playDo() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        audioContext ||= new AudioContextClass();
        if (audioContext.state === "suspended") audioContext.resume();

        const now = audioContext.currentTime;
        const gain = audioContext.createGain();
        const oscillator = audioContext.createOscillator();
        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(261.63, now);
        oscillator.detune.setValueAtTime(-2, now);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.24, now + .015);
        gain.gain.exponentialRampToValueAtTime(.075, now + .26);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .72);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + .74);
      }

      function restartAnimation(element, className) {
        element.classList.remove(className);
        void element.offsetWidth;
        element.classList.add(className);
      }

      function allCatalogAchievementsUnlocked() {
        return ACHIEVEMENT_CATALOG.every(achievement =>

      function showNextAchievement() {

        achievementShowing = true;
        achievementText.textContent = achievementQueue.shift();
        const isFinalCatalogAchievement =
          !completionDialogueShown &&
          achievementQueue.length === 0 &&
          allCatalogAchievementsUnlocked();
        const toastDuration = isFinalCatalogAchievement ? 5200 : 3500;
        const followupDelay = isFinalCatalogAchievement ? 1200 : 180;
        restartAnimation(achievementToast, "is-visible");
        window.clearTimeout(achievementTimer);
        achievementTimer = window.setTimeout(() => {
          achievementToast.classList.remove("is-visible");
          achievementShowing = false;
          window.setTimeout(() => {
            if (achievementQueue.length) {
              showNextAchievement();
            } else {
              showCompletionDialogueIfReady();
            }
          }, followupDelay);
        }, toastDuration);
      }

        achievementProgress.textContent = `${unlockedCount} / ${ACHIEVEMENT_CATALOG.length}`;

      function updateVirtualJoystick(event) {
        if (event.pointerId !== virtualJoystickPointerId) return;
        const bounds = virtualJoystick.getBoundingClientRect();
        const offsetX = event.clientX - (bounds.left + bounds.width / 2);
        const offsetY = event.clientY - (bounds.top + bounds.height / 2);
        const distance = Math.hypot(offsetX, offsetY);
        const maxOffset = bounds.width * .28;
        const scale = distance > maxOffset ? maxOffset / distance : 1;
        const thumbX = offsetX * scale;
        const thumbY = offsetY * scale;
        const deadZone = bounds.width * .1;

        joystickThumb.style.transform =
          `translate(calc(-50% + ${thumbX}px), calc(-50% + ${thumbY}px))`;
        virtualMovementKeys.clear();
        if (offsetX < -deadZone) virtualMovementKeys.add("arrowleft");
        if (offsetX > deadZone) virtualMovementKeys.add("arrowright");
        if (offsetY < -deadZone) virtualMovementKeys.add("arrowup");
        if (offsetY > deadZone) virtualMovementKeys.add("arrowdown");
      }

      function beginVirtualJoystick(event) {
        if (!playerCanMove() || virtualJoystickPointerId !== null) return;
        event.preventDefault();
        virtualJoystickPointerId = event.pointerId;
        virtualJoystick.setPointerCapture(event.pointerId);
        virtualJoystick.classList.add("is-active");
        updateVirtualJoystick(event);
      }

      function moveVirtualJoystick(event) {
        if (event.pointerId !== virtualJoystickPointerId) return;
        event.preventDefault();
        updateVirtualJoystick(event);
      }

      function endVirtualJoystick(event) {
        if (event.pointerId !== virtualJoystickPointerId) return;
        event.preventDefault();
        resetVirtualJoystick();
      }

      });
      manualClose.addEventListener("click", closeManual);
      manualBackdrop.addEventListener("click", event => {
        if (event.target === manualBackdrop) closeManual();
      });
      virtualJoystick.addEventListener("pointerdown", beginVirtualJoystick);
      virtualJoystick.addEventListener("pointermove", moveVirtualJoystick);
      virtualJoystick.addEventListener("pointerup", endVirtualJoystick);
      virtualJoystick.addEventListener("pointercancel", endVirtualJoystick);
      virtualJoystick.addEventListener("lostpointercapture", resetVirtualJoystick);
      virtualJoystick.addEventListener("click", event => event.preventDefault());
      mobileAction.addEventListener("pointerdown", event => {
        mobileAction.classList.add("is-active");
      });
      mobileAction.addEventListener("pointerup", () => mobileAction.classList.remove("is-active"));
      mobileAction.addEventListener("pointercancel", () => mobileAction.classList.remove("is-active"));
      mobileAction.addEventListener("click", event => {
        event.preventDefault();
        useMobileAction();
      });
      document.addEventListener("keydown", event => {
        const dialogueIsOpen = characterDialogue.classList.contains("is-open");
        const computerIsOpen = computerBackdrop.classList.contains("is-open");
        const scrollIsOpen = scrollBackdrop.classList.contains("is-open");
        const achievementBoardIsOpen = achievementBoardBackdrop.classList.contains("is-open");
        if (event.key === "Escape" && achievementBoardIsOpen) {
          closeAchievementBoard();
          return;
        }

        if (event.key === "Escape" && scrollIsOpen) {
          closeScroll();
          return;
        }

        if (scrollIsOpen && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
          event.preventDefault();
          changeScrollPage(event.key === "ArrowLeft" ? -1 : 1);
          return;
        }

        if (event.key === "Escape" && computerIsOpen) {
          closeComputer();
          return;
        }

        if (event.key === "Escape" && dialogueIsOpen) {
          closeRachelDialogue();
          return;
        }

        if (event.key === "Escape" && manualBackdrop.classList.contains("is-open")) {
          closeManual();
          return;
        }

        const key = event.key.toLowerCase();
        if ((event.code === "Space" || key === " ") && dialogueIsOpen) {
          event.preventDefault();
          if (!event.repeat) closeRachelDialogue();
          return;
        }

        const canControl = playerCanMove();

        if ((event.code === "Space" || key === " ") && canControl) {
          event.preventDefault();
          if (!event.repeat) interactWithNearestObject();
          return;
        }

        if (
          ["arrowleft", "arrowright", "arrowup", "arrowdown", "w", "a", "s", "d"].includes(key) &&
          canControl
        ) {
          event.preventDefault();
          movementKeys.add(key);
        }
      });
      document.addEventListener("keyup", event => {
        movementKeys.delete(event.key.toLowerCase());
      });
      window.addEventListener("blur", clearMovementInput);
      window.addEventListener("resize", fitScene);

      fitScene();
      loadScene();
      requestAnimationFrame(movePlayer);
    })();
  </script>
</body>
</html>
